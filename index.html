<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="description" content="Erste Hilfe Prüfungstrainer – FH JOANNEUM DGKP">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Erste Hilfe Prüfungstrainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: one column of med-response HUD panels with cut corners and corner brackets; Fehleranalyse docks right on wide screens; clock/timer bottom-right. Deliberately single dark theme (night-city medical HUD): black glass, mint-cyan signal colour, white type, red for errors. */
:root{
  --bg:#03070a; --bg2:#071318; --panel:rgba(6,18,23,.86); --panel-hi:rgba(10,32,38,.92);
  --ink:#e4f3f0; --muted:#7c9896; --qink:#ffffff;
  --line:rgba(52,240,200,.20); --line-strong:rgba(52,240,200,.55);
  --accent:#34f0c8; --accent-ink:#02130f; --accent-soft:rgba(52,240,200,.09); --glow:rgba(52,240,200,.35);
  --ok:#7dffb0; --ok-soft:rgba(125,255,176,.10); --bad:#ff3358; --bad-soft:rgba(255,51,88,.12); --bad-line:rgba(255,51,88,.55);
  --warn:#ffd23f; --hudbg:rgba(2,9,11,.88); --grid:rgba(52,240,200,.035);
  --f-display:"Chakra Petch","Exo 2","Segoe UI",sans-serif;
  --f-body:"Exo 2","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --cut:12px; --cut-s:7px; --gap:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;font-weight:500;line-height:1.45;min-height:100%;
  background-image:
    radial-gradient(ellipse 80% 45% at 50% -10%, rgba(52,240,200,.13), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px),
    linear-gradient(180deg,var(--bg2),var(--bg) 55%);
  background-size:auto,44px 44px,44px 44px,auto;
  background-attachment:fixed;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:24px 96px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:40;background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
::selection{background:var(--accent);color:var(--accent-ink)}
.layout{display:grid;gap:20px;max-width:1220px;margin:0 auto;align-items:start}
.wrap{width:100%;max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:var(--gap);min-width:0}
@media (min-width:1100px){
  .layout.has-side{grid-template-columns:minmax(0,700px) minmax(0,440px);justify-content:center}
  .layout.has-side .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 20px);max-height:calc(100vh - 120px);overflow:auto}
}
/* header */
.head{display:flex;flex-direction:column;gap:8px;padding-bottom:2px}
.status{display:inline-flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.status .dot{width:8px;height:8px;background:var(--accent);box-shadow:0 0 8px var(--glow);animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7vw,48px);line-height:.98;margin:0;text-transform:uppercase;letter-spacing:.03em;color:var(--qink);text-wrap:balance}
h1 .x{color:var(--accent);text-shadow:0 0 14px var(--glow)}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
h2::before{content:"// ";opacity:.55}
h3{font-family:var(--f-display);font-weight:700;font-size:19px;margin:0;color:var(--qink);letter-spacing:.02em}
.sub{color:var(--muted);margin:0;max-width:60ch}
.label{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:.8}
.ecg{display:block;width:100%;height:auto;max-height:44px;overflow:visible}
.ecg path{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-linejoin:round;filter:drop-shadow(0 0 3px var(--glow))}
.ecg .base{stroke:var(--line);filter:none}
.ecg .trace{stroke-dasharray:130 1000;animation:trace 2.4s linear infinite}
@keyframes trace{from{stroke-dashoffset:130}to{stroke-dashoffset:-1000}}
/* panels: hairline border + corner brackets */
.panel{position:relative;border:1px solid var(--line);padding:18px;display:flex;flex-direction:column;gap:var(--gap);min-width:0;
  background:
    linear-gradient(var(--accent),var(--accent)) top left/16px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) top left/2px 16px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/16px 2px no-repeat,
    linear-gradient(var(--accent),var(--accent)) bottom right/2px 16px no-repeat,
    var(--panel)}
.panel.resume{border-color:var(--line-strong);box-shadow:0 0 0 1px var(--accent-soft),0 0 24px -8px var(--glow)}
.panel.missing{border-color:rgba(255,210,63,.4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-family:var(--f-display);font-size:14.5px;font-weight:600;border:1px solid var(--line);background:transparent;color:var(--muted);padding:6px 11px;cursor:pointer;display:inline-flex;gap:8px;align-items:center;text-transform:uppercase;letter-spacing:.05em;text-align:left;
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.chip .n{font-family:var(--f-mono);font-size:11.5px;white-space:nowrap;font-weight:500}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent)}
.chip:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.tight{gap:6px}
.btn{font:inherit;font-family:var(--f-display);font-weight:700;font-size:15.5px;text-transform:uppercase;letter-spacing:.12em;padding:11px 22px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.btn.ghost{background:var(--accent-soft);color:var(--accent);border-color:var(--line-strong)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn:disabled{opacity:.3;cursor:default}
.btn:focus-visible,.chip:focus-visible,.mode:focus-visible,.cell:focus-visible,.counter:focus-visible,.step:focus-visible,.opt:has(input:focus-visible){outline:2px solid var(--warn);outline-offset:2px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.mode{font:inherit;text-align:left;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:14px 16px 14px 18px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;position:relative;
  clip-path:polygon(0 0,calc(100% - var(--cut)) 0,100% var(--cut),100% 100%,var(--cut) 100%,0 calc(100% - var(--cut)))}
.mode::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;background:var(--line-strong)}
.mode b{font-family:var(--f-display);font-size:18.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--qink);overflow-wrap:anywhere;hyphens:auto}
.mode span{color:var(--muted);font-size:14.5px;line-height:1.35}
.mode.hot{border-color:var(--bad-line);background:linear-gradient(135deg,rgba(255,51,88,.14),var(--panel) 60%)}
.mode.hot::before{background:var(--bad)}
.mode.hot b{color:#ffd9e0}
.mode:disabled{opacity:.32;cursor:default}
.bar{height:6px;overflow:hidden;background:repeating-linear-gradient(90deg, rgba(52,240,200,.14) 0 6px, transparent 6px 9px)}
.bar i{display:block;height:100%;width:0;transition:width .25s;background:repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 9px);filter:drop-shadow(0 0 4px var(--glow))}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.type{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line-strong);color:var(--accent);background:var(--accent-soft)}
.type.mc{border-color:rgba(255,210,63,.6);color:var(--warn);background:rgba(255,210,63,.08)}
.q{font-size:20.5px;font-weight:600;margin:0;text-wrap:pretty;color:var(--qink);overflow-wrap:anywhere}
.q .neg{color:var(--warn);font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);padding:11px 13px;cursor:pointer;background:rgba(0,0,0,.35);-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.opt input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);box-shadow:inset 3px 0 0 var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ff8ea2;box-shadow:inset 3px 0 0 var(--bad)}
.opt.missed{border-color:var(--ok);border-style:dashed}
.opt .tag{margin-left:auto;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;padding-top:4px}
@media (hover:hover){
  .chip:hover:not(:disabled){border-color:var(--line-strong);color:var(--ink)}
  .mode:hover:not(:disabled){border-color:var(--line-strong);background:var(--panel-hi)}
  .mode.hot:hover:not(:disabled){border-color:var(--bad)}
  .opt:hover:not(.sel):not(.right):not(.wrong){border-color:var(--line-strong)}
  .btn:hover:not(:disabled){filter:brightness(1.12)}
  .step:hover:not(:disabled){border-color:var(--line-strong)}
}
.verdict{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:3px solid}
.verdict.ok{background:var(--ok-soft);border-color:var(--ok)}
.verdict.bad{background:var(--bad-soft);border-color:var(--bad)}
.verdict strong{font-family:var(--f-display);font-size:18px;text-transform:uppercase;letter-spacing:.14em}
.verdict.ok strong{color:var(--ok)} .verdict.bad strong{color:var(--bad)}
.score{font-family:var(--f-display);font-weight:700;font-size:68px;line-height:.9;color:var(--qink);font-variant-numeric:tabular-nums;text-shadow:0 0 18px var(--glow)}
.score .of{font-size:28px;color:var(--muted);text-shadow:none}
.pill{display:inline-block;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:4px 12px;border:1px solid}
.pill.ok{color:var(--ok);border-color:var(--ok);background:var(--ok-soft)} .pill.bad{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.wrongs{display:flex;flex-direction:column;gap:14px;margin:0;padding:0;list-style:none}
.wrongs li{border-left:3px solid var(--bad);padding:2px 0 2px 12px;display:flex;flex-direction:column;gap:3px;overflow-wrap:anywhere}
.wrongs .a{color:var(--muted);font-size:15.5px}
.wrongs .a.mine{color:#ff8ea2}
.wrongs .a.ex{font-size:14.5px}
.stats{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);letter-spacing:.02em}
/* Fehleranalyse: red alert variant */
.side{border:1px solid var(--bad-line);padding:18px;display:flex;flex-direction:column;gap:var(--gap);min-width:0;
  background:
    linear-gradient(var(--bad),var(--bad)) top left/16px 2px no-repeat,
    linear-gradient(var(--bad),var(--bad)) top left/2px 16px no-repeat,
    linear-gradient(var(--bad),var(--bad)) bottom right/16px 2px no-repeat,
    linear-gradient(var(--bad),var(--bad)) bottom right/2px 16px no-repeat,
    linear-gradient(180deg,rgba(255,51,88,.08),transparent 120px),
    var(--panel)}
.side h2{color:var(--bad)}
.side .sec{display:flex;flex-direction:column;gap:8px}
.ana{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ana li{border-left:3px solid var(--line);padding:4px 0 4px 10px;font-size:15.5px;overflow-wrap:anywhere}
.ana li.must{border-color:var(--ok)}
.ana li.err{background:var(--bad-soft)}
.ana .st{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.ana li.err .st{color:var(--bad)}
.key{font-size:15.5px;border-left:3px solid var(--accent);padding:6px 10px;background:var(--accent-soft)}
.key.warnkey{border-color:var(--bad);background:var(--bad-soft)}
.key b{color:var(--bad)}
.ai{font-size:16px;line-height:1.55;display:flex;flex-direction:column;gap:6px}
.ai p{margin:0}
.ai .li{padding-left:14px;text-indent:-12px}
.ai b{color:var(--accent);font-weight:700}
.ai .wait{font-family:var(--f-mono);color:var(--muted);letter-spacing:.06em;animation:blink 1.2s steps(2) infinite}
@keyframes blink{50%{opacity:.35}}
.side .btn{padding:8px 14px;font-size:13.5px}
/* bottom-right readout */
.hud{position:fixed;right:max(16px, env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:20;pointer-events:none}
.hud-box{background:var(--hudbg);border:1px solid var(--line-strong);padding:6px 12px;display:flex;align-items:baseline;gap:8px;backdrop-filter:blur(4px);
  clip-path:polygon(var(--cut-s) 0,100% 0,100% calc(100% - var(--cut-s)),calc(100% - var(--cut-s)) 100%,0 100%,0 var(--cut-s))}
.hud-l{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
#clock,#timer{font-family:var(--f-mono);font-weight:700;font-size:21px;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:.04em;text-shadow:0 0 8px var(--glow)}
.hud-box.low{border-color:var(--bad)} .hud-box.low #timer{color:var(--bad);text-shadow:0 0 8px rgba(255,51,88,.5)}
.hud-box.sig .tag{font-family:var(--f-mono);font-size:13px;color:var(--qink);letter-spacing:.03em}
[hidden]{display:none!important}
.navbar{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.navbar .btn.sm{font-size:20px;line-height:1;padding:6px 16px}
.counter{font:inherit;font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:8px 10px;cursor:pointer;text-align:center}
.counter b{color:var(--qink);font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.02em}
.counter .caret{color:var(--accent);margin-left:4px}
.gridp{padding:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px;max-height:260px;overflow:auto}
.cell{font:inherit;font-family:var(--f-mono);font-size:12.5px;height:34px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;padding:0}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.ans{background:var(--accent-soft);border-color:var(--line-strong);color:var(--accent)}
.cell.cur{outline:2px solid var(--qink);outline-offset:1px;color:var(--qink)}
.legend{gap:14px;font-family:var(--f-mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i.cell{width:14px;height:14px;display:inline-block;cursor:default}
.cfg{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
/* Abläufe */
.steps{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.step{font:inherit;font-size:16.5px;text-align:left;display:flex;gap:12px;align-items:flex-start;width:100%;border:1px solid var(--line);padding:10px 12px;background:rgba(0,0,0,.35);color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent;overflow-wrap:anywhere}
.step .no{font-family:var(--f-mono);font-size:12.5px;color:var(--accent);min-width:22px;padding-top:3px}
.step.placed{border-color:var(--line-strong);background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
.step.right{border-color:var(--ok);background:var(--ok-soft);color:var(--ok);cursor:default}
.step.wrong{border-color:var(--bad);background:var(--bad-soft);color:#ff8ea2;cursor:default}
.step:disabled{cursor:default}
.slot{border:1px dashed var(--line);padding:10px 12px;color:var(--muted);font-family:var(--f-mono);font-size:12.5px}
.clist{display:flex;flex-direction:column;gap:6px;margin:0;padding-left:26px}
.clist li{padding-left:4px;overflow-wrap:anywhere}
.clist li::marker{color:var(--accent);font-family:var(--f-mono);font-size:.85em}
.note{font-size:15.5px;color:var(--muted);border-left:3px solid var(--line-strong);padding:4px 10px}
@media (max-width:600px){
  body{font-size:16.5px}
  .q{font-size:19px}
  .panel{padding:14px}
  .hud-box.sig .tag{font-size:11.5px}.hud .hud-l{display:none}.hud{gap:6px;bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  #clock,#timer{font-size:17px}.hud-box{padding:4px 9px}
  .score{font-size:56px}
}
@media (prefers-reduced-motion: reduce){.bar i{transition:none}.ai .wait,.status .dot,.ecg .trace{animation:none}.ecg .trace{stroke-dasharray:none}}
</style>
</head>
<body>

<div class="hud" aria-live="off"><div class="hud-box sig"><span class="hud-l">made by</span><span class="tag">@ryumatvv7</span></div><div class="hud-box"><span class="hud-l">Zeit</span><span id="clock">--:--:--</span></div><div class="hud-box" id="timerBox" hidden><span class="hud-l">Rest</span><span id="timer">30:00</span></div></div>
<div class="layout" id="layout"><div class="wrap" id="app"></div><aside class="side" id="side" hidden aria-live="polite"></aside></div>

<script>
const TOPICS={
 1:"Grundlagen, Recht & Notruf",
 2:"Bewusstlosigkeit & Seitenlage",
 3:"Reanimation Erwachsene & AED",
 4:"ABCDE & Vitalwerte",
 5:"Internistische Notfälle",
 6:"Kinder & Säuglinge",
 7:"Trauma & Blutungen",
 8:"Altfragen (Originalwortlaut)"
};
const B=[];let _id=0;
function Q(t,k,q,o,a,e){ if(k==="rf"){o=["richtig","falsch"];a=[a?0:1];} B.push({id:"q"+(++_id),t,k,q,o,a,e}); }

/* 1 Grundlagen, Recht & Notruf */
Q(1,"sc","Wie wird eine Notfallsituation laut Kuhnke (2025) definiert?",["Jede Erkrankung, die einen Arztbesuch erfordert","Ein unerwartetes Ereignis mit unmittelbarer Gefahr für das Leben oder die Gesundheit","Ein geplanter Eingriff mit erhöhtem Risiko","Jede Verletzung mit sichtbarer Blutung"],[1],"Notfall = unerwartetes Ereignis, unmittelbare Gefahr für Leben oder Gesundheit – durch Verletzungen, Vergiftungen oder akut auftretende Erkrankungen.");
Q(1,"mc","Wodurch kann es laut Folie zu einem Notfall kommen?",["Verletzungen","Vergiftungen","Akut auftretende Erkrankungen","Geplante Routineuntersuchungen"],[0,1,2],"Verletzungen, Vergiftungen, akut auftretende Erkrankungen.");
Q(1,"mc","Welche sind Ziele der Ersten Hilfe (GRC 2021)?",["Leben erhalten","Leiden lindern","Weitere Erkrankungen oder Verletzungen verhindern","Genesung fördern","Eine Diagnose stellen"],[0,1,2,3],"4 Ziele: Leben erhalten, Leiden lindern, Weiteres verhindern, Genesung fördern. Diagnosen stellen ist KEINE Aufgabe des Ersthelfers.");
Q(1,"mc","Welche Basismaßnahmen führt der Ersthelfer durch (GRC 2021)?",["Lagerung","Frische Luft","Wärme","Psychische Betreuung","Schmerzmittel verabreichen"],[0,1,2,3],"Basismaßnahmen: Lagerung, frische Luft, Wärme, psychische Betreuung. Medikamente sind keine Aufgabe des Ersthelfers.");

Q(2,"mc","Was tun, wenn der Patient nach der Reanimation wieder aufwacht?",["Stabile Seitenlage","Regelmäßige Atemkontrolle","Beim Patienten bleiben, bis die Rettung eintrifft","Den Patienten nach Hause gehen lassen"],[0,1,2],"Und: im Zweifel – drücken!");
Q(2,"rf","Laut Folie gilt: „Im Zweifel – Drücken!“",null,true,"Richtig – Schäden durch CPR ohne Stillstand sind gering, Nichtstun ist tödlich.");
Q(2,"sc","Welche Aufforderung beim Hilferuf empfiehlt die Folie?",["„Kann mal jemand schauen?“","„Rufen Sie schnell die Rettung mit der Nummer 144 – eine bewusstlose Person!“","„Ich rufe später an.“","„Hat jemand ein Pflaster?“"],[1],"Konkret ansprechen und Nummer + Situation nennen.");
Q(2,"mc","Wen ruft man laut Folie um Hilfe?",["Umstehende","Angehörige","Niemanden, man macht alles allein","Rettung 144 bzw. Euro-Notruf 112"],[0,1,3],"Um Hilfe rufen: Umstehende, Angehörige; Notruf 144/112.");
Q(2,"sc","Bei welchem GCS spricht man laut Folie von Bewusstlosigkeit?",["GCS < 15","GCS < 13","GCS < 9","GCS = 15"],[2],"Bewusstlosigkeit: GCS < 9 (d. h. ≤ 8).");
Q(2,"sc","Welche Ursache einer Bewusstlosigkeit ist laut Folie gut ursächlich behandelbar?",["Schlaganfall","Hypoglykämie","Herzinfarkt","Schädel-Hirn-Trauma"],[1],"Bewusstlosigkeit ist kausal selten behandelbar – Ausnahme Hypoglykämie.");
Q(2,"mc","Bewusstlosigkeit – welche Aussagen sind laut Folie richtig?",["Vielfältiges Zustandsbild","Oft nur Symptom einer Kreislaufstörung, seltener einer Atemstörung","Kausal selten behandelbar (Ausnahme Hypoglykämie)","Immer harmlos"],[0,1,2],"Bewusstlosigkeit ist lebensbedrohlich (Atemweg!).");
Q(2,"mc","Herz und Kreislauf – welche Aussagen sind FALSCH?",["Venen transportieren O₂-reiches Blut vom Herzen weg","Arterien transportieren O₂-armes Blut zum Herzen","Das Herz ist eine Pumpe","Das Blut zirkuliert im Kreis"],[0,1],"Arterien = O₂-reich vom Herzen weg; Venen = O₂-arm zum Herzen.");
Q(2,"rf","Beim Herzstillstand fällt die Pumpe aus; die Maßnahme ist, das Herz von außen durch rhythmische Brustkorbkompressionen zu „ersetzen“.",null,true,"Richtig.");
Q(2,"rf","Zu Beginn eines Kreislaufstillstands kann es kurzzeitig zu Krämpfen kommen; danach wird die Atmung beurteilt.",null,true,"Richtig (GRC 2025).");
Q(2,"rf","Laien sollen bei jeder Person, die nicht reagiert, an einen Kreislaufstillstand denken.",null,true,"Richtig (GRC 2025): „Vermuten Sie einen Kreislaufstillstand bei jeder Person, die nicht reagiert.“");
Q(2,"rf","Liegt eine Person, die nicht reagiert, auf dem Bauch, wird sie zum Öffnen der Atemwege auf den Rücken gedreht.",null,true,"Richtig – „Erfolgt keine Reaktion, legen Sie die Person auf den Rücken“ (GRC).");
Q(2,"sc","Ein Mann liegt auf dem Gehsteig, reagiert nicht auf Ansprechen und Schütteln und atmet ruhig ca. 14-mal pro Minute. Was ist richtig?",["CPR 30:2","Notruf, stabile Seitenlage, regelmäßig die Atmung kontrollieren","Aufsetzen und Wasser geben","Nur Notruf, keine weiteren Maßnahmen"],[1],"Bewusstlos mit normaler Atmung → SSL.");
Q(2,"rf","Einer bewusstlosen Person darf man zur Kreislaufstabilisierung etwas zu trinken geben.",null,false,"Falsch – fehlende Schutzreflexe → Aspiration/Ersticken.");
Q(2,"sc","Wie viele Schritte hat das GRC-Schema „Leben retten“?",["2 – Prüfen, Drücken","3 – Prüfen, Rufen, Drücken","4 – Prüfen, Rufen, Drücken, Warten","5 – A, B, C, D, E"],[1],"3 Schritte, um Leben zu retten: Prüfen – Rufen – Drücken (& AED).");
Q(2,"mc","Was gehört zum Schritt „Prüfen“ (GRC 2025)?",["Sicherheit","Bewusstsein","Defibrillation","Beatmung"],[0,1],"Prüfen: Sicherheit, Bewusstsein. Rufen: 112, Lautsprecher, Atmung prüfen. Drücken: CPR & AED.");
Q(2,"rf","Bewusstlosigkeit ist nicht lebensbedrohlich, solange die Person atmet.",null,false,"Falsch – sie ist lebensbedrohlich durch den gefährdeten Atemweg und/oder die Grunderkrankung.");
Q(2,"sc","Warum wird ein Bewusstloser mit normaler Atmung in die stabile Seitenlage gebracht?",["Damit er besser schläft","Damit die Atemwege frei bleiben (Zunge, Erbrochenes, Blut)","Damit der Blutdruck steigt","Damit man die Herzdruckmassage leichter durchführen kann"],[1],"Erstickungsgefahr durch Zunge, Erbrochenes, Blut.");
Q(2,"sc","Was bedeutet „Atmung normal“ im Sinne der Folie?",["Irgendeine Atembewegung ist vorhanden","Regelmäßige, unauffällige Atmung – keine Schnappatmung","Mindestens 30 Atemzüge pro Minute","Atmung nur durch die Nase"],[1],"„Überprüfen, ob Atmung NORMAL ist“ – Schnappatmung zählt nicht.");
Q(2,"sc","Was tun Sie, wenn Sie allein sind und die Person nicht reagiert?",["Weglaufen, um Hilfe zu suchen, ohne vorher zu prüfen","Laut um Hilfe rufen, Notruf mit Lautsprecher, Atmung prüfen","Zuerst den AED aus dem Nachbargebäude holen","Abwarten"],[1],"Handy auf Lautsprecher – so bleibt man beim Patienten.");
Q(2,"rf","In der stabilen Seitenlage muss die Person nicht mehr kontrolliert werden.",null,false,"Falsch – regelmäßige Evaluierung/Atemkontrolle, beim Patienten bleiben.");

/* 3 Reanimation Erwachsene & AED */
Q(3,"sc","Mit welcher Frequenz wird die Herzdruckmassage durchgeführt?",["60–80/min","80–100/min","100–120/min","120–140/min"],[2],"100–120 pro Minute.");
Q(3,"sc","Wie tief wird der Brustkorb beim Erwachsenen eingedrückt?",["2–3 cm","3–4 cm","5–6 cm","8–10 cm"],[2],"Mindestens 5 cm, aber nicht mehr als 6 cm (FH-Folien 2026, GRC 2025). Achtung: altes Notfallcheck-Blatt (2020) sagt 4–5 cm.");
Q(3,"sc","Welches Verhältnis von Kompressionen zu Beatmungen gilt beim Erwachsenen?",["15:2","30:2","30:5","5:1"],[1],"30:2 – bis Hilfe eintrifft oder der Patient zu atmen beginnt.");
Q(3,"sc","Wo ist der Druckpunkt beim Erwachsenen?",["Oberes Drittel des Brustbeins","Mitte des Brustkorbs = untere Hälfte des Brustbeins","Linke Brustseite über dem Herzen","Oberbauch unterhalb des Brustbeins"],[1],"Handballen auf die Mitte des Brustkorbs, entspricht der unteren Hälfte des Brustbeins (Sternum).");
Q(3,"mc","Welche Kriterien kennzeichnen suffiziente Thoraxkompressionen?",["Frequenz 100–120/min","Tiefe 5–6 cm","Vollständige Entlastung","Arme durchgestreckt, Rücken gerade","Patient*in auf weicher Unterlage"],[0,1,2,3],"Unterlage: HART.");
Q(3,"mc","Herzdruckmassage – welche Aussagen sind FALSCH?",["Zwischen den Kompressionen darf man sich auf dem Brustkorb abstützen","3–4 cm Tiefe genügen beim Erwachsenen","Die Finger werden verschränkt","Die Schultern befinden sich senkrecht über dem Brustkorb"],[0,1],"Vollständig entlasten (nicht lehnen), 5–6 cm tief.");
Q(3,"rf","Nach jeder Kompression wird der Brustkorb vollständig entlastet, ohne den Kontakt der Hände zum Brustkorb zu verlieren.",null,true,"Richtig (GRC-Folie).");
Q(3,"sc","Warum werden bei der Herzdruckmassage die Finger verschränkt?",["Damit die Hände nicht abrutschen und kein Druck auf die Rippen ausgeübt wird","Damit man schneller drücken kann","Damit man den Puls fühlen kann","Das ist nur bei Kindern nötig"],[0],"GRC: Finger verschränken, damit kein Druck auf die Rippen ausgeübt wird.");
Q(3,"sc","Womit beginnt die Wiederbelebung beim Erwachsenen?",["Mit 2 Beatmungen","Mit 5 Beatmungen","Mit 30 Thoraxkompressionen","Mit der Pulskontrolle über 1 Minute"],[2],"Erwachsene: Beginn mit 30 Herzmassagen, dann 2 Beatmungen. 5 Beatmungen = Kinder.");
Q(3,"rf","Beim Erwachsenen beginnt man die CPR mit 5 Beatmungen.",null,false,"Falsch – das gilt für Kinder/Säuglinge. Erwachsene: 30 Kompressionen zuerst.");
Q(3,"mc","Was gehört laut Folie zum Beatmen beim Erwachsenen?",["Schutzfolie auf den Mund legen","Kopf überstrecken","2× Mund-zu-Mund beatmen oder Hilfsmittel verwenden","Kontrolle: Brustkorb muss sich heben","Mit voller Kraft so viel Luft wie möglich einblasen"],[0,1,2,3],"Nur so viel Luft, dass sich der Brustkorb hebt – übermäßige Beatmung vermeiden.");
Q(3,"sc","Wie lange dauert eine Beatmung (Einblasen) ungefähr?",["ca. 1 Sekunde","ca. 3 Sekunden","ca. 5 Sekunden","ca. 10 Sekunden"],[0],"Gleichmäßig einblasen, Brustkorb hebt sich in rund 1 s.");
Q(3,"sc","Wie lange darf die Herzdruckmassage für 2 Beatmungen höchstens unterbrochen werden?",["5 Sekunden","10 Sekunden","20 Sekunden","30 Sekunden"],[1],"Nicht mehr als 10 s – auch wenn eine oder beide Beatmungen ineffektiv sind.");
Q(3,"sc","Bei der Mund-zu-Mund-Beatmung wird die Nase …",["offen gelassen","mit Zeigefinger und Daumen der Hand an der Stirn verschlossen","mit einem Tuch bedeckt","nicht beachtet"],[1],"Nase mit Zeigefinger und Daumen der Stirnhand verschließen, Kinn weiter anheben.");
Q(3,"sc","Der Brustkorb hebt sich bei der Beatmung nicht. Was ist der erste Schritt?",["Sofort stärker beatmen","Mundhöhle inspizieren – ausräumen","AED abnehmen","Reanimation abbrechen"],[1],"1) Mundhöhle inspizieren – ausräumen 2) Überstreckung überprüfen 3) nach 2 Versuchen wieder Herzmassage.");
Q(3,"sc","Wie viele Beatmungsversuche macht man, bevor man wieder mit der Herzdruckmassage beginnt?",["1","2","5","So viele, bis sich der Brustkorb hebt"],[1],"Nach 2 Versuchen wieder Herzmassage – Kompressionen haben Vorrang.");
Q(3,"rf","Wenn sich mit 2 Versuchen keine Beatmung erreichen lässt, soll an eine Fremdkörperverlegung der Atemwege gedacht werden.",null,true,"Richtig (GRC 2025).");
Q(3,"mc","Compression-Only-CPR – welche Aussagen sind richtig?",["Für Laien ohne Schulung","Wenn aus ethischen bzw. hygienischen Gründen keine Beatmung möglich ist","Trotzdem Herzdruckmassage 100–120/min","Durchgehendes Drücken","Ohne Beatmung ist eine Reanimation sinnlos"],[0,1,2,3],"„TROTZDEM Herzdruckmassage!!!“");
Q(3,"rf","Wer nicht beatmen kann oder will, soll gar nicht reanimieren.",null,false,"Falsch – dann kontinuierliche Thoraxkompressionen (Compression-Only).");
Q(3,"mc","Bis wann wird die Reanimation fortgesetzt?",["Bis professionelle Helfer übernehmen bzw. zum Aufhören auffordern","Bis die Person wirklich aufwacht, sich bewegt, die Augen öffnet und normal atmet","Bis man erschöpft ist","Genau 5 Minuten, dann abbrechen"],[0,1,2],"Keine feste Zeitgrenze für Laien.");
Q(3,"mc","Welche sind KEINE Gründe, die Reanimation abzubrechen?",["Es könnte eine Rippe gebrochen sein","Nach 5 Minuten zeigt sich noch kein Erfolg","Der Notarzt weist an, aufzuhören","Die Person öffnet die Augen und atmet normal"],[0,1],"Rippenbrüche und fehlender schneller Erfolg sind keine Abbruchgründe.");
Q(3,"rf","Aus Angst vor Rippenbrüchen soll man beim älteren Menschen weniger tief drücken.",null,false,"Falsch – GRC: CPR beginnen, ohne sich um Verletzungen Gedanken zu machen; Leben retten ist wichtiger.");
Q(3,"sc","Wofür steht AED?",["Automatische Elektro-Diagnose","Automatisierter externer Defibrillator","Akute elektrische Dysfunktion","Arterielle Endo-Dilatation"],[1],"Automatic External Defibrillator.");
Q(3,"sc","Was ist der erste Schritt in der AED-Vorgangsweise?",["Elektroden aufkleben","Einschalten","Schock auslösen","Analyse drücken"],[1],"1 Einschalten · 2 Elektroden aufkleben · 3 Analyse · 4 (wenn angezeigt) Schock auslösen · 5 Patient nicht berühren · 6 Gerät gibt Schock ab.");
Q(3,"sc","Wohin werden die AED-Elektroden geklebt?",["Auf die Kleidung über der Brust","Auf die nackte Brust","Auf den Bauch","Auf beide Oberarme"],[1],"Selbstklebende Elektroden auf die nackte Brust (wie auf dem AED abgebildet).");
Q(3,"rf","Während der AED den Rhythmus analysiert und wenn ein Schock empfohlen wird, darf niemand den Patienten berühren.",null,true,"Richtig.");
Q(3,"sc","Was tun Sie unmittelbar nach der Schockabgabe?",["Puls 1 Minute lang tasten","Sofort mit der Herzdruckmassage fortsetzen","Den AED ausschalten","Erneut Analyse drücken"],[1],"Unverzüglich erneut mit der Wiederbelebung beginnen und den Sprachanweisungen folgen.");
Q(3,"mc","Der AED empfiehlt keinen Schock. Welche Aussagen sind FALSCH?",["Dann ist der Patient sicher gerettet – CPR beenden","Elektroden abnehmen und AED wegräumen","Sofort wieder mit der Herzdruckmassage beginnen","Weiter den Anweisungen des AED folgen"],[0,1],"Kein Schock = sofort weiter CPR, AED bleibt angeschlossen.");
Q(3,"mc","Wann darf ein AED laut Folie nicht angewendet werden?",["Auf nassem Untergrund","Auf leitendem Untergrund (z. B. Schienen)","In explosiver Umgebung (Dämpfe)","Bei älteren Menschen"],[0,1,2],"Nasser, leitender Untergrund, explosive Umgebung.");
Q(3,"mc","Welche Rhythmen sind schockbar?",["Kammerflimmern","Pulslose ventrikuläre Tachykardie","Asystolie","Pulslose elektrische Aktivität (PEA)"],[0,1],"Nicht schockbar: Asystolie, PEA.");
Q(3,"sc","Welcher Rhythmus ist NICHT schockbar?",["Kammerflimmern","Pulslose ventrikuläre Tachykardie","Asystolie","Alle drei sind schockbar"],[2],"Asystolie und PEA sind nicht schockbar.");
Q(3,"sc","Bei welchem Rhythmus sind die Reanimationserfolge am besten?",["Asystolie","Kammerflimmern","PEA","Sinusrhythmus"],[1],"Frühdefibrillation: beste Erfolge bei Kammerflimmern.");
Q(3,"sc","Um wie viel sinkt die Überlebenschance mit jeder Minute ohne Defibrillation?",["ca. 1 %","ca. 5 %","ca. 10 %","ca. 50 %"],[2],"Mit jeder Minute Nicht-Defibrillation sinkt die Überlebenschance um 10 %.");
Q(3,"rf","Die einzige sichere Therapie bei Kammerflimmern ist die Defibrillation.",null,true,"Richtig (Folie Frühdefibrillation).");
Q(3,"sc","Sie sind allein. Wann dürfen Sie den Patienten verlassen, um einen AED zu holen?",["Immer","Nur, wenn Sie den AED innerhalb von 1 Minute holen können – sonst mit der Reanimation beginnen","Nie, auch wenn der AED im selben Raum hängt","Nach 10 Minuten CPR"],[1],"Folie „AED holen lassen“: schicken Sie jemanden; allein nur, wenn innerhalb 1 Minute erreichbar.");
Q(3,"rf","Sind mehrere Helfer vor Ort, wird die Reanimation fortgeführt, während die Elektroden aufgeklebt werden.",null,true,"Richtig – Unterbrechungen minimieren.");
Q(3,"sc","Was unterscheidet einen halbautomatischen von einem vollautomatischen AED?",["Beim halbautomatischen muss der Helfer den Auslöseknopf drücken","Der halbautomatische analysiert nicht","Der vollautomatische braucht keine Elektroden","Es gibt keinen Unterschied"],[0],"GRC 2025: vollautomatisch gibt den Schock selbst ab, halbautomatisch per Knopfdruck.");
Q(3,"rf","Einen AED darf jeder verwenden – eine Schulung ist dafür nicht erforderlich.",null,true,"Richtig (GRC 2025: Beschilderung soll das deutlich machen).");
Q(3,"mc","Sicherheit bei der CPR (GRC 2025) – welche Aussagen sind richtig?",["Das Infektionsrisiko für Helfer ist gering","Das Risiko eines versehentlichen Schocks durch den AED ist gering","Laien sollen erst reanimieren, wenn ein Arzt den Stillstand bestätigt hat","Notfallzeugen sollen psychologische Unterstützung angeboten bekommen"],[0,1,3],"Laien beginnen CPR ohne Angst vor Schäden.");
Q(3,"mc","Reanimation im Krankenhausbett – was ist laut Folie richtig?",["Platz schaffen: Bett von der Wand, 360-Grad-Zugang","Harte Unterlage: CPR-Modus des Bettes","Reanimationsbrett unterlegen oder Patient aus dem Bett heraus","Bei Platzmangel im Sitzen reanimieren"],[0,1,2],"Keine Reanimation im Sitzen!");
Q(3,"rf","Eine Reanimation im Sitzen (z. B. im Rollstuhl) ist zulässig, wenn das Umlagern schwierig ist.",null,false,"Falsch – „Keine Reanimation im Sitzen etc.!“ – harte Unterlage, Rückenlage.");
Q(3,"sc","Wozu dient der CPR-Modus / CPR-Hebel am Pflegebett?",["Das Bett wird höher gestellt","Die Matratze wird härter/flach – harte Unterlage für die Herzdruckmassage","Das Bett schaltet einen Alarm aus","Das Kopfteil wird hochgestellt"],[1],"Harte Unterlage: CPR-Modus Bett, Reanimationsbrett oder aus dem Bett heraus.");
Q(3,"sc","Wie heißt der Griff, mit dem die Beatmungsmaske gehalten wird?",["Rautekgriff","C-Griff","Esmarch-Handgriff","Heimlich-Griff"],[1],"Folie „Herzdruckmassage und Beatmung – Der C-Griff“.");
Q(3,"sc","Was ist nach dem ERC-Algorithmus der richtige Ablauf?",["Drücken → Prüfen → Rufen","Prüfen → Rufen → Drücken (& AED)","Rufen → Drücken → Prüfen","AED → Prüfen → Rufen"],[1],"3 Schritte: Prüfen – Rufen – Drücken; AED anlegen, sobald möglich.");
Q(3,"sc","Was folgt laut Ablaufschema (Eichinger) nach „keine Reaktion und keine normale Atmung“?",["Stabile Seitenlage","Notruf 112/144","2 Beatmungen","Abwarten"],[1],"Notruf → 30 Thoraxkompressionen → 2 Beatmungen → weiter 30:2 → AED, sobald er eintrifft.");
Q(3,"sc","ALS-Algorithmus: Nach einem Schock wird wie lange CPR durchgeführt, bis zur nächsten Rhythmuskontrolle?",["30 Sekunden","1 Minute","2 Minuten","5 Minuten"],[2],"„Sofort wieder CPR für 2 Minuten“ – bei schockbar und nicht schockbar.");
Q(3,"sc","ALS-Algorithmus: Wann wird bei nicht schockbarem Rhythmus Adrenalin gegeben?",["Nie","So bald wie möglich, dann alle 3–5 Minuten","Erst nach dem 3. Schock","Nur nach ROSC"],[1],"Nicht schockbar (PEA, Asystolie): Adrenalin alle 3–5 min. Schockbar: erstes Adrenalin nach 3 Defibrillationen.");
Q(3,"mc","Welche gehören zu den reversiblen Ursachen eines Kreislaufstillstands (ALS-Folie)?",["Hypoxie","Hypovolämie","Hypothermie","Spannungspneumothorax","Hypertonie"],[0,1,2,3],"4 H (Hypoxie, Hypovolämie, Hyper-/Hypokaliämie, Hypothermie) + HITS (Herzbeuteltamponade, Intoxikation, Thrombose, Spannungspneumothorax).");
Q(3,"rf","Wenn das Brustbein durch die Kleidung nicht gut zu tasten ist, ist es sinnvoll, die Kleidung zu entfernen.",null,true,"Richtig (GRC 2025) – richtiger Druckpunkt ist wichtiger.");
Q(3,"sc","Der Disponent erkennt einen Kreislaufstillstand. Wonach soll er fragen, sobald die CPR läuft?",["Nach der Versicherungsnummer","Ob ein AED/Defibrillator vor Ort ist","Nach den Allergien des Patienten","Nach dem Hausarzt"],[1],"GRC 2025: Frage nach AED; bei mehreren Zeugen einen zum nächsten AED schicken.");
Q(3,"mc","Lebensrettende Basismaßnahmen Erwachsene – welche Aussagen sind FALSCH?",["Die Herzdruckmassage wird mit 60–80/min durchgeführt","Man kniet neben dem Patienten","Die Arme werden gerade gehalten","Man beginnt beim Erwachsenen mit 2 Beatmungen"],[0,3],"100–120/min; Beginn mit 30 Kompressionen.");
Q(3,"sc","Was zeigt das Reanimations-EKG?",["Den Blutdruck","Die elektrische Funktion des Herzens über die Zeit (z. B. über die Defi-Elektroden)","Die Sauerstoffsättigung","Den Blutzucker"],[1],"Folie „Das Reanimations-EKG“.");
Q(3,"sc","Was bedeutet ROSC im ALS-Algorithmus?",["Rückkehr eines Spontankreislaufs","Reanimation ohne Schock","Rhythmus ohne Sauerstoff","Rettungsorganisation"],[0],"ROSC = Return of Spontaneous Circulation; danach nach ABCDE vorgehen, SpO₂ 94–98 %.");

/* 4 ABCDE & Vitalwerte */
Q(4,"sc","Wofür steht „A“ im ABCDE-Schema?",["Atmung","Airway (Atemweg)","Anamnese","Allergie"],[1],"A Airway · B Breathing · C Circulation · D Disability · E Exposure/Environment.");
Q(4,"sc","Wofür steht „D“ im ABCDE-Schema?",["Defibrillation","Diagnose","Disability (Neurologie)","Druckverband"],[2],"D = Disability: GCS, Orientierung, Neurologie, Blutzucker.");
Q(4,"mc","ABCDE – welche Zuordnungen sind FALSCH?",["C = CPR","D = Defibrillation","B = Breathing","E = Exposure (Kopf-Fuß-Untersuchung, Temperatur)"],[0,1],"C = Circulation, D = Disability.");
Q(4,"rf","Das ABCDE-Schema dient der strukturierten Beurteilung einer Person, die krank, verletzt oder im Schock ist.",null,true,"Richtig (GRC 2025).");
Q(4,"mc","Worauf soll man laut GRC 2025 vor dem ABCDE sofort achten?",["Sicherheit","Reaktion des Betroffenen","Lebensbedrohliche Blutungen","Krankenversicherung"],[0,1,2],"Sicherheit, Reaktion, lebensbedrohliche Blutungen.");
Q(4,"mc","Wie wird der Atemweg (A) beurteilt?",["Blick in den Mund (Blut, Zähne, Erbrochenes)","Redet der Patient mit mir → Atemweg vermutlich frei","Mund notfalls gewaltsam öffnen","Hilfsmittel zum Aufhebeln des Mundes verwenden"],[0,1],"CAVE: kein gewaltsames Öffnen des Mundes, keine Hilfsmittel.");
Q(4,"rf","Spricht der Patient mit mir, ist der Atemweg vermutlich frei.",null,true,"Richtig.");
Q(4,"rf","Zur Beurteilung des Atemwegs darf der Mund mit Gewalt geöffnet werden.",null,false,"Falsch – CAVE: kein gewaltsames Öffnen, keine Hilfsmittel.");
Q(4,"sc","Bei welchem Buchstaben wird laut Folie auch die Halswirbelsäule (HWS) mitbedacht?",["A","B","C","E"],[0],"Airway: Atemweg frei? Spricht Pat.? Halswirbelsäule?");
Q(4,"sc","Normale Atemfrequenz eines Erwachsenen in Ruhe laut Folie?",["6–8/min","12–15/min","20–25/min","30–40/min"],[1],"12–15/min in Ruhe.");

Q(4,"mc","Was wird unter B (Breathing) beurteilt?",["Atemarbeit","Atemmuster","SpO₂","Lungenauskultation und Atemfrequenz","Blutdruck"],[0,1,2,3],"Blutdruck gehört zu C.");
Q(4,"mc","Was wird unter C (Circulation) beurteilt?",["Rekapillarisierungszeit","Blutdruck (RR)","Herzfrequenz","Hautcolorit","GCS"],[0,1,2,3],"GCS gehört zu D. Dazu: Herzauskultation, Ultraschall.");
Q(4,"sc","Wie klingt eine normale Lungenauskultation laut Folie?",["Giemen und Pfeifen","Vesikuläres Atmen (Baumrascheln)","Stridor","Rasseln"],[1],"Normal: vesikulär, kein Giemen, kein Pfeifen.");
Q(4,"sc","Wie heißt die bläuliche Verfärbung von Haut und Lippen?",["Ikterus","Zyanose","Erythem","Blässe"],[1],"Normal: rosig, nicht blau (Zyanose).");

const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const PRESETS=[[20,20],[30,30],[30,20],[20,15]];
const cfg=Object.assign({n:30,m:30,sc:true},store.get("eh_cfg",{}));
if(!cfg.m)cfg.m=cfg.n;
const S={sel:new Set(Object.keys(TOPICS).map(Number).filter(t=>B.some(q=>q.t===t))),queue:[],i:0,mode:"",timed:false,deadline:0,startedAt:0,timeout:false,grid:false,confirm:false,exam:false};
let wrongSet=new Set(store.get("eh_wrong",[]));
let seen=store.get("eh_seen",{});
let seqDone=store.get("eh_seq",{});
const byId=Object.fromEntries(B.map(q=>[q.id,q]));
function saveRun(){store.set("eh_run",{mode:S.mode,timed:S.timed,exam:S.exam,deadline:S.deadline,startedAt:S.startedAt,i:S.i,items:S.queue.map(x=>[x.q.id,x.order,x.picked,x.done?1:0,x.ok?1:0])})}
function loadRun(){const r=store.get("eh_run",null);if(!r||!r.items)return null;
  const items=r.items.filter(([id])=>byId[id]);if(!items.length)return null;
  if(r.timed&&r.deadline&&Date.now()>r.deadline)return null;
  if(!r.timed&&items.every(x=>x[3]))return null;
  return {...r,items}}
function clearRun(){store.del("eh_run")}
const app=document.getElementById("app");
const side=document.getElementById("side"), layout=document.getElementById("layout");
const clockEl=document.getElementById("clock"), timerEl=document.getElementById("timer"), timerBox=document.getElementById("timerBox");
let samplePromise=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null);
let aiCtl=null, aiOff=false;
const pad=n=>String(n).padStart(2,"0");
function tick(){
  const d=new Date();clockEl.textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  if(S.timed&&S.deadline){
    const left=Math.max(0,S.deadline-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);
    timerBox.hidden=false;timerEl.textContent=`${pad(m)}:${pad(s)}`;timerBox.classList.toggle("low",left<5*60000);
    if(left===0&&!S.timeout&&S.queue.length){S.timeout=true;submitTimed();}
  }else timerBox.hidden=true;
}

async function runAI(q,picked){
  const box=side.querySelector("#ai"); const btn=side.querySelector("#aiBtn");
  if(!box)return;
  const sample=await samplePromise;
  if(!sample||aiOff){ side.querySelector("#aiSec").hidden=true; return; }
  if(aiCtl)aiCtl.abort(); const ctl=aiCtl=new AbortController();
  btn.hidden=true; box.innerHTML='<span class="wait">Analyse läuft …</span>';
  try{
    await sample(aiPrompt(q,picked),{signal:ctl.signal,onText:({text})=>{box.innerHTML=mini(text)}});
  }catch(e){
    if(e&&e.code==="cancelled")return;
    if(e&&["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){aiOff=true;side.querySelector("#aiSec").hidden=true;return;}
    box.innerHTML=(e&&e.text?mini(e.text):"")+`<p class="stats">${e&&e.code==="rate_limited"?"Zu viele Anfragen – bitte kurz warten.":"Die Erklärung konnte nicht geladen werden."}</p>`;
    btn.hidden=false; btn.textContent="Erneut versuchen";
  }finally{ if(aiCtl===ctl)aiCtl=null; }
}

function examPool(){ return B.filter(q=>!cfg.sc||q.k!=="mc"); }
function examSet(){
  const pool=examPool(), n=cfg.n;
  const per={};pool.forEach(q=>(per[q.t]=per[q.t]||[]).push(q));
  const tl=Object.keys(per); const base=Math.floor(n/Math.max(1,tl.length));
  let out=[];tl.forEach(t=>out.push(...shuffle(per[t]).slice(0,base)));

    else if(!ans.has(o)&&p.has(o)){l.classList.add("wrong");tag.textContent="✗ falsch gewählt"}
    else if(ans.has(o)){l.classList.add("missed");tag.textContent="fehlte"}});
  app.querySelector("#fb").innerHTML=`<div class="verdict ${it.ok?"ok":"bad"}"><strong>${it.ok?"Richtig":"Nicht ganz"}</strong><span>${esc(q.e)}</span></div>`;
  if(!it.ok)showSide(q,p);
}
function submitTimed(){
  if(!S.queue.length)return;
  S.queue.forEach(it=>{ if(it.picked.length){ it.done=true; it.ok=evalItem(it); record(it);} else { it.done=false; it.ok=false; } });
  store.set("eh_seen",seen); store.set("eh_wrong",[...wrongSet]);
  result();
}
function result(){
  hideSide();
  clearRun();
  const timed=S.timed, used=S.startedAt?Math.min(Date.now(),S.deadline||Date.now())-S.startedAt:0;
  const limit=S.deadline?Math.round((S.deadline-S.startedAt)/60000):0;
  S.timed=false;S.deadline=0;S.confirm=false;tick();
  const items=S.queue; const n=items.length; const r=items.filter(x=>x.done&&x.ok).length; const pct=n?r/n*100:0;
  const g=grade(pct), pass=g<5;
  const wrong=items.filter(x=>!x.ok); const skipped=items.filter(x=>!x.done).length;
  const byT={};items.forEach(x=>{const o=byT[x.q.t]=byT[x.q.t]||{r:0,n:0};o.n++;if(x.ok)o.r++});
  app.innerHTML=`
  <header class="head"><div class="status"><span class="dot"></span>${esc(S.mode)} beendet${S.timeout?" · Zeit abgelaufen":""}</div><h1>Ergebnis</h1>${ECG}</header>
  <section class="panel">
    <div class="row" style="align-items:flex-end;gap:16px"><span class="score">${r}<span class="of"> / ${n}</span></span>
    <span class="pill ${pass?"ok":"bad"}">${Math.round(pct)} % · Note ${g} · ${GRADE[g]}</span></div>
    ${timed?`<div class="stats">Benötigte Zeit: ${pad(Math.floor(used/60000))}:${pad(Math.floor(used%60000/1000))} von ${limit}:00</div>`:""}
    ${skipped?`<div class="stats">${skipped} Fragen nicht beantwortet (zählen als falsch)</div>`:""}
    <div class="stats">${Object.entries(byT).map(([t,o])=>`${esc(TOPICS[t])}: ${o.r}/${o.n}`).join(" · ")}</div>
    <div class="row"><button class="btn" id="again">Fehler dieser Runde wiederholen (${wrong.length})</button><button class="btn ghost" id="home">Zu den Themen</button></div>
  </section>
  ${wrong.length?`<section class="panel"><h2>Falsch oder offen</h2><ul class="wrongs">${wrong.map(x=>`<li><div>${esc(x.q.q)}</div>${!x.done?`<div class="a mine">nicht beantwortet</div>`:`<div class="a mine">Deine Antwort: ${x.picked.map(i=>esc(x.q.o[i])).join(" · ")}</div>`}<div class="a">Richtig: ${x.q.a.map(i=>esc(x.q.o[i])).join(" · ")}</div><div class="a ex">${esc(x.q.e)}</div></li>`).join("")}</ul></section>`:""}`;
  const again=app.querySelector("#again");again.disabled=!wrong.length;again.onclick=()=>start(shuffle(wrong.map(x=>x.q)),"Fehler");
  app.querySelector("#home").onclick=home;window.scrollTo(0,0);
}
/* ---------- Abläufe: Schritte ordnen ---------- */
const SQ={list:[],i:0,placed:[],pool:[],checked:false,ok:false,score:0};
function seqStart(list){ if(!list.length)return; hideSide(); SQ.list=list; SQ.i=0; SQ.score=0; seqLoad(); }
function seqLoad(){ const s=SQ.list[SQ.i]; SQ.placed=[]; SQ.pool=shuffle(s.steps.map((_,k)=>k)); SQ.checked=false; SQ.ok=false; seqView(); window.scrollTo(0,0); }
function seqOrders(s){ return [s.steps.map((_,k)=>k)].concat(s.alt||[]); }
function seqBest(s){ let best=null,bm=-1; seqOrders(s).forEach(o=>{const m=o.filter((v,k)=>SQ.placed[k]===v).length; if(m>bm){bm=m;best=o}}); return best; }
function seqView(){
  const s=SQ.list[SQ.i], n=SQ.list.length, last=SQ.i===n-1;
  const best=SQ.checked?seqBest(s):null;
  const placedHtml=SQ.placed.map((k,pos)=>{const cls=SQ.checked?(best[pos]===k?"right":"wrong"):"placed";
    return `<li><button class="step ${cls}" data-p="${pos}" ${SQ.checked?"disabled":""}><span class="no">${pos+1}.</span><span>${esc(s.steps[k])}</span></button></li>`}).join("");
  const free=SQ.pool.filter(k=>!SQ.placed.includes(k));
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Übersicht</button><span class="stats">Ablauf ${SQ.i+1} / ${n} · ${SQ.score} richtig</span></div>
  <div class="bar"><i style="width:${(SQ.i+(SQ.checked?1:0))/n*100}%"></i></div>
  <section class="panel">
    <div class="qhead"><span class="type">Schritte ordnen</span><span class="label">${esc(TOPICS[s.t])}</span></div>
    <h3>${esc(s.title)}</h3>
    <span class="label">Deine Reihenfolge${SQ.checked?"":" · antippen zum Entfernen"}</span>
    <ol class="steps">${placedHtml||`<li class="slot">Tippe unten die Schritte in der richtigen Reihenfolge an.</li>`}</ol>
    ${free.length?`<span class="label">Schritte</span><ul class="steps">${free.map(k=>`<li><button class="step" data-k="${k}"><span class="no">+</span><span>${esc(s.steps[k])}</span></button></li>`).join("")}</ul>`:""}
    <div id="fb">${SQ.checked?`<div class="verdict ${SQ.ok?"ok":"bad"}"><strong>${SQ.ok?"Richtig":"Nicht ganz"}</strong><span>Richtige Reihenfolge:</span><ol class="clist">${seqOrders(s)[0].map(k=>`<li>${esc(s.steps[k])}</li>`).join("")}</ol></div><div class="note">${esc(s.note)}<br><span class="stats">Quelle: ${esc(s.src)}</span></div>`:""}</div>
    <div class="row">${SQ.checked?`<button class="btn" id="next">${last?"Fertig":"Nächster Ablauf →"}</button>${SQ.ok?"":`<button class="btn ghost" id="retry">Nochmal</button>`}`:`<button class="btn" id="chk" ${free.length?"disabled":""}>Prüfen</button><button class="btn ghost" id="reset" ${SQ.placed.length?"":"disabled"}>Zurücksetzen</button><button class="btn ghost" id="skip" ${last?"disabled":""}>Überspringen</button>`}</div>
  </section>`;
  const $=x=>app.querySelector(x);
  $("#back").onclick=home;
  app.querySelectorAll(".step[data-k]").forEach(b=>b.onclick=()=>{SQ.placed.push(+b.dataset.k);seqView()});
  if(!SQ.checked) app.querySelectorAll(".step[data-p]").forEach(b=>b.onclick=()=>{SQ.placed.splice(+b.dataset.p,1);seqView()});
  if($("#chk"))$("#chk").onclick=()=>{SQ.checked=true;SQ.ok=seqOrders(s).some(o=>o.every((v,k)=>SQ.placed[k]===v));
    if(SQ.ok){SQ.score++;seqDone[s.id]=1;store.set("eh_seq",seqDone);} seqView();};
  if($("#reset"))$("#reset").onclick=()=>{SQ.placed=[];seqView()};
  if($("#skip"))$("#skip").onclick=()=>{SQ.i++;seqLoad()};
  if($("#retry"))$("#retry").onclick=()=>{seqLoad()};
  if($("#next"))$("#next").onclick=()=>{ if(last)home(); else {SQ.i++;seqLoad();} };
}
function checklists(){
  hideSide();
  const groups={};SEQ.forEach(s=>(groups[s.t]=groups[s.t]||[]).push(s));
  app.innerHTML=`
  <div class="row" style="justify-content:space-between"><button class="btn ghost sm" id="back">← Übersicht</button><button class="btn sm" id="ord">Schritte ordnen</button></div>
  <header class="head"><div class="label">Abläufe zum Lernen</div><h1>Checklisten</h1><p class="sub">Alle Schritte in der Reihenfolge der FH-Folien. ✓ = schon richtig geordnet.</p></header>
  ${CHECK.map(c=>`<section class="panel${/Prüfung/.test(c.title)?" missing":""}"><h3>${esc(c.title)}</h3><ul class="clist">${c.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul><span class="stats">Quelle: ${esc(c.src)}</span></section>`).join("")}
  ${Object.keys(TOPICS).filter(t=>groups[t]).map(t=>`<h2>${esc(TOPICS[t])}</h2>${groups[t].map(s=>`<section class="panel"><div class="qhead"><h3>${esc(s.title)}</h3><span class="stats">${seqDone[s.id]?"✓ geordnet":""}</span></div><ol class="clist">${s.steps.map(x=>`<li>${esc(x)}</li>`).join("")}</ol><div class="note">${esc(s.note)}</div><span class="stats">Quelle: ${esc(s.src)}</span></section>`).join("")}`).join("")}`;
  app.querySelector("#back").onclick=home;
  app.querySelector("#ord").onclick=()=>seqStart(shuffle(SEQ));
  window.scrollTo(0,0);
}
tick();
home();
</script>
